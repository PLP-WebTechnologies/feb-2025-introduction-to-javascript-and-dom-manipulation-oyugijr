<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>JavaScript & DOM Demo</title>
  <style>
    .highlight {
      color: teal;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <header>
    <h1 id="title">Welcome to DOM Manipulation</h1>
  </header>

  <main>
    <section>
      <p id="description">This paragraph will be updated with JavaScript.</p>
      <button onclick="changeText()">Change Text</button>
      <button onclick="toggleHighlight()">Toggle Highlight</button>
    </section>

    <section>
      <ul id="itemList">
        <li>Item 1</li>
        <li>Item 2</li>
      </ul>
      <button onclick="addItem()">Add Item</button>
      <button onclick="removeItem()">Remove Last Item</button>
    </section>
  </main>

  <footer>
    <small>&copy; 2025 Oyugi Mourice</small>
  </footer>

  <script src="script.js"></script>
</body>
</html>
